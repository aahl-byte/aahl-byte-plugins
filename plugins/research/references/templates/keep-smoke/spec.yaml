# Smoke test for gpu keep: the smallest spot box runs a dummy job that writes one tick file a minute for three minutes, then DONE.
# It exercises lease, provision, launch, pull, done and stop on real AWS for under a cent. Run it in the foreground, then check:
#   gpu keep run spec.yaml && ./check.sh
# launch.sh fails unless it returns within 30 s and the job outlives its ssh; check.sh fails unless a pull landed mid-run.
# Watch it go red once: point launch at ./launch_broken.sh, and keep should stop the box and end the chain with `failures`.
name: <project>-keep-smoke
types:
  - {instance_type: c8a.large, jobs: 1}
  - {instance_type: c7a.large, jobs: 1}
max_price_hr: 0.15
market: {}
lease: {idle_minutes: 30, max_hours: 1, disk_gb: 20}
provision: ./provision.sh
sync: ./sync.sh
launch: ./launch.sh
pulls: [{remote: /root/keep-smoke/out, local: ./out}]
pull_every_minutes: 1
done_marker: ./out/DONE
title: gpu keep smoke test on a real spot box
what: The smallest spot box runs a dummy job that writes one tick file a minute for three minutes and then a done marker, so gpu keep's lease, provision, launch, pull, done and stop path runs once before it supervises a research chain.
why: A real run for under a cent shows the hooks, the pulls and the stop at the done marker work before keep is trusted with a chain that costs dollars an hour.
how: gpu keep run leases a small spot box, the provision hook makes the output directory, the launch hook starts the dummy job detached, the supervisor pulls every minute, sees the done marker, stops the box and exits.
project: <cloud.project>
tags: {spike: infra}
expect_hours: [0.1, 0.3]
guards:
  budget_usd: 1
  max_leases_per_hour: 2
  max_consecutive_failures: 1
  capacity_backoff_minutes: [1, 2]
