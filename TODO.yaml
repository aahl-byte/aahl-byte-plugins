    notes:
      - |-
        **Plan:** [docs/plans/2026-06-28-notes-architect-hosting-decouple.md](docs/plans/2026-06-28-notes-architect-hosting-decouple.md) — design at `-design.md` sibling.

        - Two layers, **manifest (`structure.yaml`) as the contract**: `na-build-notes` emits portable markdown (wikilinks `[[slug#h|alias]]` + footnotes `[^1]`, no stylesheet line); new `na-host-docsify` skill renders docsify.
        - Branch: `refactor/decouple-hosting-from-build-notes`.
        - Tests: dependency-free `node --test` over `plugins/notes-architect/scripts/test/`.
        - Tasks T1–T13 are sequential; each ends in a commit.
      - '**Test runner quirk (Node 22):** `node --test <dir>/` fails (tries to load
        the dir as a module). Use the glob form: `node --test plugins/notes-architect/scripts/test/*.test.js`.'
      - "**index.html slugify bug — fix in T11.** The docsify `index.html` search
        slugify uses char-class `[ -⁯…]` (ASCII space start) which strips ASCII letters
        → heading anchors collapse to empty, so search results don't deep-link to
        headings. The new `scripts/lib/wikilinks.js` `slugifyHeading` uses the correct
        `[ -⁯⸀-⹿…]` (matches docsify core). When T11 factors a shared slugify for
        the wikilink plugin, use the corrected range so search + wikilink anchors
        agree with real docsify."
      - '**T12 must fix deploy/Makefile.** Its `verify:` target still calls the deleted
        `scripts/verify.js`; re-point to `host/docsify/verify-host.js` (and confirm
        the `serve`/`open` targets + `NOTES` root still make sense post-move). Also
        re-point any build step to `host/docsify/build.js`.'
      - |-
        **Done — all 13 tasks shipped + final review fixes applied.** 25 unit tests green; end-to-end (content-verify → init → build → verify-host → wikilink render) passes.

        Deferred minor nits from final review (low impact, intentionally not done):
        - slug == filename is documented but not enforced (`basename(path) === slug`).
        - duplicate identical headings on one page resolve a `#heading` wikilink to the first (docsify dedups with `-1`/`-2`).
        - host-leak check is first-line-only (matches the historical leak vector).
